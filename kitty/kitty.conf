# Kitty — Night E-Ink (High Legibility)

# Font
font_family JetBrainsMono Nerd Font
font_size 12.0

# Behavior
enable_audio_bell no
confirm_os_window_close 0
shell_integration enabled

# Background
background_opacity 0.95
dynamic_background_opacity no

# Base colors
background            #070809
foreground            #F3EEE6

# Selection
selection_background  #1A2330
selection_foreground  #F3EEE6

# Cursor
cursor                #F3EEE6
cursor_text_color     #070809
cursor_shape beam
cursor_beam_thickness 1.5

# Tabs / UI
active_tab_background   #0C0F12
active_tab_foreground   #F3EEE6
inactive_tab_background #070809
inactive_tab_foreground #C6BFB6

# Borders
active_border_color   #C6B089
inactive_border_color #1A1F24

# 16-color palette
color0  #070809
color1  #B07A6A
color2  #8FAE9B
color3  #C6B089
color4  #87AFC7
color5  #A6A3D8
color6  #8AA6A6
color7  #EEE8DF

# Bright colors
color8  #49545E
color9  #C08A7A
color10 #9CBBA8
color11 #D7C29A
color12 #9BBFD6
color13 #B4B1E5
color14 #9DB7B7
color15 #FAF4EC

# Spacing
window_padding_width 8 12

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 5.0
scrollback_pager nvim -u NONE -c "set nonumber" -

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# URLs
detect_urls yes
open_url_with default

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
